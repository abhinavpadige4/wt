<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening - Example Cafe</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url('https://www.transparenttextures.com/patterns/paper-fibers.png') repeat, #fffaf4;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #ffe0c3, #ffd8b5);
      color: #000;
      padding: 25px;
      font-size: 32px;
      text-align: center;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    nav {
      background: #f0f0f0 url('https://www.transparenttextures.com/patterns/asfalt-dark.png') repeat;
      text-align: center;
      padding: 12px 0;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: darkcyan;
      font-weight: bold;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    h2 {
      text-align: center;
      color: darkslategray;
      margin-top: 30px;
      font-size: 28px;
      text-shadow: 1px 1px rgba(0, 0, 0, 0.1);
    }

    table {
      margin: 30px auto;
      border-collapse: collapse;
      width: 90%;
      max-width: 1000px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 15px;
      text-align: center;
    }

    th {
      background-color: #f8e9d8;
      color: #333;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #fdf7f2;
    }

    tr:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>

<body>
  <header>Example Cafe</header>

  <nav>
    <a href="cafe.htm">HOME</a>
    <a href="menu.htm">MENU</a>
    <a href="recipies.htm">RECIPES</a>
    <a href="opening.htm">OPENING</a>
    <a href="contact.htm">CONTACT</a>
  </nav>

  <h2>Restaurant Timings</h2>

  <table>
    <tr>
      <th>Time</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>
      <th>Saturday</th>
      <th>Sunday</th>
    </tr>
    <tr>
      <th>Breakfast</th>
      <td>7:30–11:30</td>
      <td>7:30–11:30</td>
      <td>7:30–11:30</td>
      <td>7:30–11:30</td>
      <td>7:30–11:30</td>
      <td>7:30–11:30</td>
      <td>7:30–11:30</td>
    </tr>
    <tr>
      <th>Lunch</th>
      <td>12:00–2:00</td>
      <td>12:00–2:00</td>
      <td>12:00–2:00</td>
      <td>12:00–2:00</td>
      <td>12:00–2:00</td>
      <td>12:00–2:00</td>
      <td>12:00–2:00</td>
    </tr>
  </table>
</body>
</html>
